<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miraggia — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --abysse: #00445D;
  --nuit: #1A1A33;
  --pistache: #BCFA91;
  --brume: #ADC8C8;
  --lilas: #D0A7F5;
  --neige: #EDEDED;
  --white: #fff;
  --muted: #5a6a7a;
  --border: #e8eaf0;
  --bg: #f4f5f8;
  --r: 12px;
  --rs: 8px;
}
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--nuit); min-height: 100vh; }

.topbar {
  background: var(--nuit); padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.logo .gg { color: var(--pistache); }
.logo .ia { color: var(--lilas); font-weight: 300; font-style: italic; }
.topbar-tag { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 12px; }
.btn {
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px;
  padding: 8px 16px; border-radius: var(--rs); border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; text-decoration: none;
}
.btn-ghost { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.12); }
.btn-ghost:hover { background: rgba(255,255,255,0.14); color: #fff; }
.btn-abysse { background: var(--abysse); color: #fff; }
.btn-abysse:hover { background: #005577; }
.btn-danger { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; font-size: 12px; padding: 7px 14px; }
.btn-danger:hover { background: #e74c3c; color: #fff; }

.main { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }

/* KPIs */
.kpi-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.kpi {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 18px 22px; flex: 1; min-width: 120px;
}
.kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; }
.kpi-value { font-size: 32px; font-weight: 700; color: var(--abysse); line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* LINK BAR */
.link-bar {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
}
.link-bar-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.link-input {
  flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--rs);
  font-family: 'Poppins', sans-serif; font-size: 12px; color: var(--nuit);
  background: var(--bg); outline: none; cursor: text; min-width: 0;
}
.copy-btn {
  font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 700;
  padding: 8px 18px; border: none; border-radius: var(--rs); cursor: pointer;
  background: var(--pistache); color: var(--nuit); white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.copy-btn:hover { background: #a8f070; }

/* SEARCH */
.search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.search-input {
  flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: var(--rs);
  font-family: 'Poppins', sans-serif; font-size: 13px; outline: none;
  background: var(--white); transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--abysse); }
.result-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* LIST */
.brief-row {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  display: flex; align-items: center; gap: 14px; padding: 15px 18px;
  margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
}
.brief-row:hover { border-color: var(--abysse); box-shadow: 0 2px 12px rgba(0,68,93,0.08); transform: translateY(-1px); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--abysse); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
}
.row-info { flex: 1; min-width: 0; }
.row-name { font-size: 14px; font-weight: 600; }
.row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-tags { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.tag-ecom { background: rgba(0,68,93,0.1); color: var(--abysse); }
.tag-life { background: rgba(173,200,200,0.4); color: #1a5c5c; }
.tag-pack { background: rgba(208,167,245,0.3); color: #5c2a9a; }
.tag-urgent { background: #fff0e0; color: #c05000; }
.tag-visuels { background: var(--pistache); color: var(--nuit); }
.row-date { font-size: 11px; color: var(--muted); flex-shrink: 0; min-width: 60px; text-align: right; }
.row-arrow { color: #ccc; font-size: 18px; flex-shrink: 0; }

/* EMPTY */
.empty { text-align: center; padding: 70px 20px; }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty-title { font-size: 17px; font-weight: 700; margin-bottom: 7px; }
.empty-text { font-size: 13px; color: var(--muted); line-height: 1.7; }

/* ══ DETAIL ══ */
.detail-view { display: none; }
.detail-view.active { display: block; }
.list-view.hidden { display: none; }

.detail-back {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  cursor: pointer; margin-bottom: 22px; padding: 6px 0;
  border: none; background: none; font-family: 'Poppins', sans-serif; transition: color 0.15s;
}
.detail-back:hover { color: var(--abysse); }

.detail-header {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r);
  padding: 22px 26px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 16px;
}
.detail-avatar {
  width: 52px; height: 52px; border-radius: 50%; background: var(--abysse); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.detail-name { font-size: 19px; font-weight: 700; }
.detail-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.detail-date { font-size: 11px; color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; }

.dsection { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.dsection-title {
  padding: 12px 22px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.dsection-body { padding: 18px 22px; }

.dfield-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.dfield-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; }
.dfield-value { font-size: 14px; font-weight: 500; }
.dfield-value.accent { color: var(--abysse); font-weight: 700; }
.dfield-value.urgent { color: #c05000; font-weight: 700; }

.type-cards { display: flex; flex-direction: column; gap: 8px; }
.type-card { border: 1px solid var(--border); border-radius: var(--rs); display: flex; overflow: hidden; }
.type-card-left { flex: 1; padding: 13px 16px; }
.type-card-name { font-size: 14px; font-weight: 700; color: var(--abysse); margin-bottom: 3px; }
.type-card-detail { font-size: 12px; color: var(--muted); }
.type-card-right { padding: 13px 18px; background: var(--abysse); text-align: center; min-width: 72px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.type-card-num { font-size: 24px; font-weight: 800; color: var(--pistache); line-height: 1; }
.type-card-lbl { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; margin-top: 2px; }

.tags-row { display: flex; flex-wrap: wrap; gap: 5px; }
.dtag { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: rgba(0,68,93,0.07); color: var(--abysse); }

.notes-block {
  background: rgba(208,167,245,0.07); border: 1px solid rgba(208,167,245,0.3);
  border-radius: var(--rs); padding: 14px 16px;
  font-size: 13px; line-height: 1.7; font-style: italic; color: var(--nuit);
}

.detail-actions { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 0; }

@media(max-width:600px){
  .main{padding:20px 14px 60px;} .topbar{padding:0 16px;}
  .kpi{min-width:100px;padding:14px 14px;} .kpi-value{font-size:24px;}
  .row-date,.row-tags{display:none;}
}
</style>
</head>

<script>
// ── SUPABASE CONFIG ── Remplacez ces deux valeurs après création de votre projet
const SUPABASE_URL = 'https://cxktdducsujgjpuabylw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4a3RkZHVjc3VqZ2pwdWFieWx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjUxNzEsImV4cCI6MjA5Mzc0MTE3MX0.IT1Hr5v_Xmi_KFcJMEHDsXc1htro3aRAbf-fnmzZXJQ';

let allBriefs = [];
const typeLabels = {ecommerce:'E-commerce',lifestyle:'Lifestyle',packshot:'Packshot'};
const typeTagClass = {ecommerce:'tag-ecom',lifestyle:'tag-life',packshot:'tag-pack'};
const delaiLabels = {'48h':'⚡ 48h — Urgent','5j':'5 jours ouvrés','1sem':'1 semaine'};
const defLabels = {'1k':'1K','2k':'2K','4k':'4K'};
const poseLabels = {droit:'Debout droit',marche:'En marchant',relaxe:'Relaxé',assis:'Assis',allonge:'Allongé'};

async function load() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/briefs?select=*&order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) throw new Error('Fetch failed');
    const data = await res.json();
    // Normalize field names from DB
    allBriefs = data.map(b => ({
      ...b,
      mcat: b.mannequins_catalogue,
      mperso: b.mannequins_perso,
      nbposes: b.nb_poses,
      ptype: b.photo_type,
      vt_ecommerce: b.vt_ecommerce,
      vt_ecommerce_looks: b.vt_ecommerce_looks,
      vt_ecommerce_visuels: b.vt_ecommerce_visuels,
      vt_lifestyle: b.vt_lifestyle,
      vt_lifestyle_looks: b.vt_lifestyle_looks,
      vt_lifestyle_visuels: b.vt_lifestyle_visuels,
      vt_packshot: b.vt_packshot,
      vt_packshot_looks: b.vt_packshot_looks,
      vt_packshot_visuels: b.vt_packshot_visuels,
      dateDisplay: b.created_at ? new Date(b.created_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '',
      date: b.created_at
    }));
  } catch(e) {
    console.error('Supabase load error:', e);
    allBriefs = [];
  }
}

async function deleteBriefFromDB(id) {
  await fetch(`${SUPABASE_URL}/rest/v1/briefs?id=eq.${id}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
  });
}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(n){if(!n)return'?';const p=n.trim().split(' ');return(p[0][0]+(p[1]?.[0]||'')).toUpperCase();}
function computeTotal(b){return['ecommerce','lifestyle','packshot'].reduce((s,t)=>b['vt_'+t]?s+(parseInt(b['vt_'+t+'_looks'])||0)*(parseInt(b['vt_'+t+'_visuels'])||0):s,0);}

function updateKPIs(){
  document.getElementById('k-total').textContent=allBriefs.length;
  document.getElementById('k-visuels').textContent=allBriefs.reduce((s,b)=>s+computeTotal(b),0);
  document.getElementById('k-urgent').textContent=allBriefs.filter(b=>b.delai==='48h').length;
}

function filteredBriefs(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase().trim();
  if(!q)return allBriefs;
  return allBriefs.filter(b=>`${b.name||''} ${b.brand||''} ${b.email||''}`.toLowerCase().includes(q));
}

function renderList(){
  const briefs=filteredBriefs();
  document.getElementById('result-count').textContent=allBriefs.length?`${briefs.length} brief${briefs.length>1?'s':''}`:'' ;
  const list=document.getElementById('briefs-list');
  if(!allBriefs.length){
    list.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Aucun brief reçu</div><p class="empty-text">Les briefs apparaîtront ici une fois le formulaire rempli.<br>Copiez le lien ci-dessus et envoyez-le à vos clients.</p></div>`;
    return;
  }
  if(!briefs.length){
    list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Aucun résultat</div><p class="empty-text">Essayez un autre terme.</p></div>`;
    return;
  }
  list.innerHTML=briefs.map(b=>{
    const types=['ecommerce','lifestyle','packshot'].filter(t=>b['vt_'+t]);
    const total=computeTotal(b);
    const d=new Date(b.date);
    const ds=isNaN(d)?(b.dateDisplay||''):d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
    return `<div class="brief-row" onclick="openDetail(${b.id})">
      <div class="avatar">${initials(b.name)}</div>
      <div class="row-info">
        <div class="row-name">${esc(b.name||'—')}</div>
        <div class="row-meta">${esc(b.brand||'—')} · ${esc(b.email||'')}</div>
      </div>
      <div class="row-tags">
        ${types.map(t=>`<span class="tag ${typeTagClass[t]}">${typeLabels[t]}</span>`).join('')}
        ${b.delai==='48h'?`<span class="tag tag-urgent">Urgent</span>`:''}
        ${total>0?`<span class="tag tag-visuels">${total} visuels</span>`:''}
      </div>
      <div class="row-date">${ds}</div>
      <div class="row-arrow">›</div>
    </div>`;
  }).join('');
}

function openDetail(id){
  const b=allBriefs.find(x=>x.id===id);
  if(!b)return;
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});

  const types=['ecommerce','lifestyle','packshot'].filter(t=>b['vt_'+t]);
  const total=computeTotal(b);
  const poses=(b.poses||[]).map(p=>poseLabels[p]||p);
  const formats=b.formats||[];
  const defs=(b.defs||[]).map(d=>defLabels[d]||d);

  const typeCards=types.map(t=>{
    const l=parseInt(b['vt_'+t+'_looks'])||0,v=parseInt(b['vt_'+t+'_visuels'])||0;
    return `<div class="type-card">
      <div class="type-card-left">
        <div class="type-card-name">${typeLabels[t]}</div>
        <div class="type-card-detail">${l} look${l!==1?'s':''} · ${v} visuel${v!==1?'s':''} par look</div>
      </div>
      <div class="type-card-right">
        <div class="type-card-num">${l*v}</div>
        <div class="type-card-lbl">visuels</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('detail-content').innerHTML=`
  <div class="detail-header">
    <div class="detail-avatar">${initials(b.name)}</div>
    <div>
      <div class="detail-name">${esc(b.name||'—')}</div>
      <div class="detail-sub">${esc(b.brand||'—')} · ${esc(b.email||'')}${b.phone?' · '+esc(b.phone):''}</div>
    </div>
    <div class="detail-date">${esc(b.dateDisplay||'')}</div>
  </div>

  ${types.length?`<div class="dsection">
    <div class="dsection-title">📸 Types de visuels — ${total} visuels au total</div>
    <div class="dsection-body"><div class="type-cards">${typeCards}</div></div>
  </div>`:''}

  <div class="dsection">
    <div class="dsection-title">🎨 Format & Définition</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Format(s)</div><div class="dfield-value">${formats.length?`<div class="tags-row">${formats.map(f=>`<span class="dtag">${esc(f)}</span>`).join('')}</div>`:'—'}</div></div>
      <div><div class="dfield-label">Définition</div><div class="dfield-value">${defs.length?`<div class="tags-row">${defs.map(d=>`<span class="dtag">${esc(d)}</span>`).join('')}</div>`:'—'}</div></div>
    </div></div>
  </div>

  <div class="dsection">
    <div class="dsection-title">🧍 Mannequins & Poses</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Mannequins catalogue</div><div class="dfield-value accent">${esc(b.mcat||'0')}</div></div>
      <div><div class="dfield-label">Mannequins personnalisés</div><div class="dfield-value accent">${esc(b.mperso||'0')}</div></div>
      <div><div class="dfield-label">Nombre de poses</div><div class="dfield-value">${esc(b.nbposes||'—')}</div></div>
      <div><div class="dfield-label">Types de poses</div><div class="dfield-value">${poses.length?`<div class="tags-row">${poses.map(p=>`<span class="dtag">${esc(p)}</span>`).join('')}</div>`:'—'}</div></div>
    </div></div>
  </div>

  <div class="dsection">
    <div class="dsection-title">📦 Livraison & Références</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Délai souhaité</div><div class="dfield-value ${b.delai==='48h'?'urgent':''}">${esc(delaiLabels[b.delai]||'—')}</div></div>
      <div><div class="dfield-label">Photos fournies</div><div class="dfield-value">${b.ptype==='pro'?'Packshot professionnel':b.ptype==='iphone'?'📱 Photos iPhone':'—'}</div></div>
      ${b.ptype==='iphone'?`<div><div class="dfield-label">Prise en charge refs</div><div class="dfield-value">${b.iphone_service==='oui'?'✓ Miraggia s\'en occupe':'Client autonome'}</div></div>`:''}
    </div></div>
  </div>

  ${b.notes?`<div class="dsection">
    <div class="dsection-title">💬 Notes complémentaires</div>
    <div class="dsection-body"><div class="notes-block">${esc(b.notes)}</div></div>
  </div>`:''}

  <div class="detail-actions">
    <button class="btn btn-danger" onclick="deleteBrief(${b.id})">✕ Supprimer</button>
    <a href="mailto:${esc(b.email)}?subject=Votre%20devis%20Miraggia%20%E2%80%94%20${encodeURIComponent(b.brand||'')}&body=Bonjour%20${encodeURIComponent(b.name||'')}%2C%0A%0AMerci%20pour%20votre%20brief.%0A%0ACordialement%2C%0AL%27%C3%A9quipe%20Miraggia" class="btn btn-abysse" style="text-decoration:none;">✉ Répondre par email</a>
  </div>`;
}

function closeDetail(){
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('list-view').classList.remove('hidden');
}

async function deleteBrief(id) {
  if (!confirm('Supprimer ce brief définitivement ?')) return;
  await deleteBriefFromDB(id);
  await load();
  updateKPIs();
  closeDetail();
  renderList();
}

function copyLink() {
  const url = window.location.href.replace(/[^/]*$/, 'miraggia-brief.html');
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copié !'; btn.style.background = '#a8f070';
    setTimeout(() => { btn.textContent = 'Copier le lien'; btn.style.background = ''; }, 2000);
  }).catch(() => { document.getElementById('form-url-input').select(); });
}

function exportCSV(){
  if(!allBriefs.length){alert('Aucun brief à exporter.');return;}
  const cols=['name','brand','email','phone','vt_ecommerce','vt_ecommerce_looks','vt_ecommerce_visuels','vt_lifestyle','vt_lifestyle_looks','vt_lifestyle_visuels','vt_packshot','vt_packshot_looks','vt_packshot_visuels','formats','defs','mcat','mperso','nbposes','poses','delai','ptype','iphone_service','notes','dateDisplay'];
  const rows=[cols.join(';'),...allBriefs.map(b=>cols.map(c=>{const v=Array.isArray(b[c])?b[c].join('|'):(b[c]||'');return`"${String(v).replace(/"/g,'""')}"`;}).join(';'))];
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+rows.join('\n'));
  a.download=`miraggia-briefs-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

document.getElementById('form-url-input').value = window.location.href.replace(/[^/]*$/, 'miraggia-brief.html');

// Auto-refresh toutes les 30s
setInterval(async () => { await load(); updateKPIs(); renderList(); }, 30000);

// Init
(async () => { await load(); updateKPIs(); renderList(); })();
</script>
</body>
</html>
