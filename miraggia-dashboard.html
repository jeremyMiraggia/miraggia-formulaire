<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miraggia — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --abysse:#00445D;--nuit:#1A1A33;--pistache:#BCFA91;
  --brume:#ADC8C8;--lilas:#D0A7F5;--neige:#EDEDED;
  --white:#fff;--muted:#5a6a7a;--border:#e8eaf0;--bg:#f4f5f8;
  --r:12px;--rs:8px;
}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--nuit);min-height:100vh;}
.topbar{background:var(--nuit);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
.btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;padding:8px 16px;border-radius:var(--rs);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12);}
.btn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff;}
.btn-abysse{background:var(--abysse);color:#fff;}
.btn-abysse:hover{background:#005577;}
.btn-danger{background:transparent;color:#e74c3c;border:1px solid #e74c3c;font-size:12px;padding:7px 14px;}
.btn-danger:hover{background:#e74c3c;color:#fff;}
.main{max-width:860px;margin:0 auto;padding:32px 24px 80px;}
/* KPIs */
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 22px;flex:1;min-width:120px;}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:6px;}
.kpi-value{font-size:32px;font-weight:700;color:var(--abysse);line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;}
/* LINK BAR */
.link-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.link-bar-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;}
.link-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);font-family:'Poppins',sans-serif;font-size:12px;color:var(--nuit);background:var(--bg);outline:none;min-width:0;}
.copy-btn{font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;padding:8px 18px;border:none;border-radius:var(--rs);cursor:pointer;background:var(--pistache);color:var(--nuit);white-space:nowrap;transition:all 0.15s;flex-shrink:0;}
.copy-btn:hover{background:#a8f070;}
/* SEARCH */
.search-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.search-input{flex:1;padding:10px 16px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:'Poppins',sans-serif;font-size:13px;outline:none;background:var(--white);transition:border-color 0.15s;}
.search-input:focus{border-color:var(--abysse);}
.result-count{font-size:12px;color:var(--muted);white-space:nowrap;}
/* LIST */
.brief-row{background:var(--white);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:14px;padding:15px 18px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
.brief-row:hover{border-color:var(--abysse);box-shadow:0 2px 12px rgba(0,68,93,0.08);transform:translateY(-1px);}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--abysse);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.row-info{flex:1;min-width:0;}
.row-name{font-size:14px;font-weight:600;}
.row-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-tags{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.tag{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.tag-ecom{background:rgba(0,68,93,0.1);color:var(--abysse);}
.tag-life{background:rgba(173,200,200,0.4);color:#1a5c5c;}
.tag-pack{background:rgba(208,167,245,0.3);color:#5c2a9a;}
.tag-morte{background:rgba(188,250,145,0.35);color:#2a6a00;}
.tag-urgent{background:#fff0e0;color:#c05000;}
.tag-visuels{background:var(--pistache);color:var(--nuit);}
.row-date{font-size:11px;color:var(--muted);flex-shrink:0;min-width:60px;text-align:right;}
.row-arrow{color:#ccc;font-size:18px;flex-shrink:0;}
/* EMPTY */
.empty{text-align:center;padding:70px 20px;}
.empty-icon{font-size:44px;margin-bottom:14px;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:7px;}
.empty-text{font-size:13px;color:var(--muted);line-height:1.7;}
/* DETAIL */
.detail-view{display:none;}
.detail-view.active{display:block;}
.list-view.hidden{display:none;}
.detail-back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:22px;padding:6px 0;border:none;background:none;font-family:'Poppins',sans-serif;transition:color 0.15s;}
.detail-back:hover{color:var(--abysse);}
.detail-header{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:22px 26px;margin-bottom:12px;display:flex;align-items:center;gap:16px;}
.detail-avatar{width:52px;height:52px;border-radius:50%;background:var(--abysse);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.detail-name{font-size:19px;font-weight:700;}
.detail-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.detail-date{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap;}
.dsection{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.dsection-title{padding:12px 22px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);}
.dsection-body{padding:18px 22px;}
.dfield-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
.dfield-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;}
.dfield-value{font-size:14px;font-weight:500;}
.dfield-value.accent{color:var(--abysse);font-weight:700;}
.dfield-value.urgent{color:#c05000;font-weight:700;}
.type-cards{display:flex;flex-direction:column;gap:8px;}
.type-card{border:1px solid var(--border);border-radius:var(--rs);display:flex;overflow:hidden;}
.type-card-left{flex:1;padding:13px 16px;}
.type-card-name{font-size:14px;font-weight:700;color:var(--abysse);margin-bottom:3px;}
.type-card-detail{font-size:12px;color:var(--muted);}
.type-card-right{padding:13px 18px;background:var(--abysse);text-align:center;min-width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.type-card-num{font-size:24px;font-weight:800;color:var(--pistache);line-height:1;}
.type-card-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;margin-top:2px;}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;}
.dtag{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:rgba(0,68,93,0.07);color:var(--abysse);}
.notes-block{background:rgba(208,167,245,0.07);border:1px solid rgba(208,167,245,0.3);border-radius:var(--rs);padding:14px 16px;font-size:13px;line-height:1.7;font-style:italic;color:var(--nuit);}
.detail-actions{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;}
@media(max-width:600px){
  .main{padding:20px 14px 60px;}.topbar{padding:0 16px;}
  .kpi{min-width:100px;padding:14px 14px;}.kpi-value{font-size:24px;}
  .row-date,.row-tags{display:none;}
}
</style>
</head>

<div class="main">

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Briefs reçus</div><div class="kpi-value" id="kpi-total">—</div></div>
    <div class="kpi"><div class="kpi-label">Visuels estimés</div><div class="kpi-value" id="kpi-visuels">—</div></div>
    <div class="kpi"><div class="kpi-label">Urgents (48h)</div><div class="kpi-value" id="kpi-urgent" style="color:#c05000;">—</div></div>
  </div>

  <!-- LINK BAR -->
  <div class="link-bar">
    <span class="link-bar-label">🔗 Lien formulaire</span>
    <input class="link-input" id="form-url-input" readonly>
    <button class="copy-btn" id="copy-btn" onclick="copyLink()">Copier le lien</button>
  </div>

  <!-- LIST VIEW -->
  <div id="list-view" class="list-view">
    <div class="search-row">
      <input class="search-input" id="search-input" placeholder="Rechercher par nom, marque, email…" oninput="renderList()">
      <span class="result-count" id="result-count"></span>
    </div>
    <div id="brief-list"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detail-view" class="detail-view">
    <button class="detail-back" onclick="closeDetail()">← Retour à la liste</button>
    <div id="detail-content"></div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://cxktdducsujgjpuabylw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Y9QUDccG9phPnWIv-_0IdQ_D6jdtGxc';

const delaiLabels = { '48h':'EXPRESS — 48h', '5j':'Rapide — 5 jours', '1sem':'Standard — 1 semaine' };
let allBriefs = [];

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ return (n||'?').trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

async function load() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/briefs?select=*&order=created_at.desc`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
  });
  const data = await res.json();
  allBriefs = (data||[]).map(b => {
    const d = new Date(b.created_at);
    return { ...b,
      mcat: b.mannequins_catalogue ?? b.mcat ?? 0,
      mperso: b.mannequins_perso ?? b.mperso ?? 0,
      dateDisplay: d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' })
    };
  });
}

function updateKPIs() {
  document.getElementById('kpi-total').textContent = allBriefs.length;
  const totalV = allBriefs.reduce((s,b) => {
    return s
      + (b.vt_ecommerce ? (b.vt_ecommerce_looks||0)*(b.vt_ecommerce_visuels||0) : 0)
      + (b.vt_lifestyle ? (b.vt_lifestyle_looks||0)*(b.vt_lifestyle_visuels||0) : 0)
      + (b.vt_packshot  ? (b.vt_packshot_looks||0)*(b.vt_packshot_visuels||0) : 0)
      + (b.vt_morte     ? (b.vt_morte_visuels||0)   : 0)
      + (b.vt_reseaux   ? (b.vt_reseaux_visuels||0) : 0)
      + (b.vt_video     ? (b.vt_video_visuels||0)   : 0);
  }, 0);
  document.getElementById('kpi-visuels').textContent = totalV || '—';
  document.getElementById('kpi-urgent').textContent = allBriefs.filter(b=>b.delai==='48h').length || '0';
}

function renderList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = allBriefs.filter(b =>
    (b.name||'').toLowerCase().includes(q) ||
    (b.brand||'').toLowerCase().includes(q) ||
    (b.email||'').toLowerCase().includes(q)
  );
  document.getElementById('result-count').textContent = `${filtered.length} brief${filtered.length!==1?'s':''}`;
  if (!filtered.length) {
    document.getElementById('brief-list').innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Aucun brief trouvé</div>
        <div class="empty-text">Partagez le lien du formulaire à vos clients pour recevoir vos premiers briefs.</div>
      </div>`;
    return;
  }
  document.getElementById('brief-list').innerHTML = filtered.map(b => {
    const totalV =
      (b.vt_ecommerce ? (b.vt_ecommerce_looks||0)*(b.vt_ecommerce_visuels||0) : 0) +
      (b.vt_lifestyle ? (b.vt_lifestyle_looks||0)*(b.vt_lifestyle_visuels||0) : 0) +
      (b.vt_packshot  ? (b.vt_packshot_looks||0)*(b.vt_packshot_visuels||0) : 0) +
      (b.vt_morte     ? (b.vt_morte_visuels||0) : 0);
    return `
    <div class="brief-row" onclick="openDetail(${b.id})">
      <div class="avatar">${initials(b.name)}</div>
      <div class="row-info">
        <div class="row-name">${esc(b.name||'—')}</div>
        <div class="row-meta">${esc(b.brand||'')} · ${esc(b.email||'')}</div>
      </div>
      <div class="row-tags">
        ${b.vt_ecommerce?'<span class="tag tag-ecom">E-com</span>':''}
        ${b.vt_lifestyle?'<span class="tag tag-life">Lifestyle</span>':''}
        ${b.vt_packshot?'<span class="tag tag-pack">Packshot</span>':''}
        ${b.vt_morte?'<span class="tag tag-morte">Nature morte</span>':''}
        ${b.vt_reseaux?'<span class="tag tag-morte">Réseaux</span>':''}
        ${b.vt_video?'<span class="tag tag-pack">Vidéos</span>':''}
        ${b.delai==='48h'?'<span class="tag tag-urgent">EXPRESS</span>':''}
        ${totalV?`<span class="tag tag-visuels">${totalV} visuels</span>`:''}
      </div>
      <div class="row-date">${esc(b.dateDisplay||'')}</div>
      <div class="row-arrow">›</div>
    </div>`;
  }).join('');
}

function openDetail(id) {
  const b = allBriefs.find(x => x.id === id);
  if (!b) return;

  const types = [
    b.vt_ecommerce && { name:'E-commerce', l: b.vt_ecommerce_looks||0, v: b.vt_ecommerce_visuels||0, detail: (l,v) => `${l} look${l!==1?'s':''} · ${v} visuel${v!==1?'s':''} par look` },
    b.vt_lifestyle && { name:'Lifestyle', l: b.vt_lifestyle_looks||0, v: b.vt_lifestyle_visuels||0, detail: (l,v) => `${l} look${l!==1?'s':''} · ${v} visuel${v!==1?'s':''} par look` },
    b.vt_packshot  && { name:'Packshot',  l: b.vt_packshot_looks||0,  v: b.vt_packshot_visuels||0,  detail: (l,v) => `${l} produit${l!==1?'s':''} · ${v} visuel${v!==1?'s':''} par produit` },
    b.vt_morte     && { name:'Nature Morte',     l: null, v: b.vt_morte_visuels||0   },
    b.vt_reseaux   && { name:'Réseaux Sociaux',   l: null, v: b.vt_reseaux_visuels||0 },
    b.vt_video     && { name:'Vidéos',             l: null, v: b.vt_video_visuels||0   },
  ].filter(Boolean);

  const total =
    (b.vt_ecommerce ? (b.vt_ecommerce_looks||0)*(b.vt_ecommerce_visuels||0) : 0) +
    (b.vt_lifestyle ? (b.vt_lifestyle_looks||0)*(b.vt_lifestyle_visuels||0) : 0) +
    (b.vt_packshot  ? (b.vt_packshot_looks||0)*(b.vt_packshot_visuels||0)   : 0) +
    (b.vt_morte     ? (b.vt_morte_visuels||0) : 0);

  const typeCards = types.map(t => {
    const count = t.name === 'Nature Morte' ? t.v : t.l * t.v;
    const detail = t.name === 'Nature Morte'
      ? `${t.v} visuel${t.v!==1?'s':''}`
      : `${t.l} look${t.l!==1?'s':''} · ${t.v} visuel${t.v!==1?'s':''} par ${t.name==='Packshot'?'produit':'look'}`;
    return `
    <div class="type-card">
      <div class="type-card-left">
        <div class="type-card-name">${esc(t.name)}</div>
        <div class="type-card-detail">${detail}</div>
      </div>
      <div class="type-card-right">
        <div class="type-card-num">${count}</div>
        <div class="type-card-lbl">visuels</div>
      </div>
    </div>`;
  }).join('');

  const formats = Array.isArray(b.formats) ? b.formats : [];
  const defs = Array.isArray(b.defs) ? b.defs : [];

  document.getElementById('detail-content').innerHTML = `
  <div class="detail-header">
    <div class="detail-avatar">${initials(b.name)}</div>
    <div>
      <div class="detail-name">${esc(b.name||'—')}</div>
      <div class="detail-sub">${esc(b.brand||'—')} · ${esc(b.email||'')}${b.phone?' · '+esc(b.phone):''}</div>
    </div>
    <div class="detail-date">${esc(b.dateDisplay||'')}</div>
  </div>

  ${types.length ? `<div class="dsection">
    <div class="dsection-title">📸 Types de visuels — ${total} visuels au total</div>
    <div class="dsection-body"><div class="type-cards">${typeCards}</div></div>
  </div>` : ''}

  <div class="dsection">
    <div class="dsection-title">🎨 Format & Définition</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Format(s)</div><div class="dfield-value">${formats.length?`<div class="tags-row">${formats.map(f=>`<span class="dtag">${esc(f)}</span>`).join('')}</div>`:'—'}</div></div>
      <div><div class="dfield-label">Définition</div><div class="dfield-value">${defs.length?`<div class="tags-row">${defs.map(d=>`<span class="dtag">${esc(d)}</span>`).join('')}</div>`:'—'}</div></div>
    </div></div>
  </div>

  <div class="dsection">
    <div class="dsection-title">🧍 Mannequins</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Catalogue</div><div class="dfield-value accent">${esc(b.mcat||'0')}</div></div>
      <div><div class="dfield-label">Personnalisés</div><div class="dfield-value accent">${esc(b.mperso||'0')}</div></div>
    </div></div>
  </div>

  <div class="dsection">
    <div class="dsection-title">📦 Livraison & Références</div>
    <div class="dsection-body"><div class="dfield-grid">
      <div><div class="dfield-label">Délai souhaité</div><div class="dfield-value ${b.delai==='48h'?'urgent':''}">${esc(delaiLabels[b.delai]||'—')}</div></div>
      <div><div class="dfield-label">Photos fournies</div><div class="dfield-value">${b.ptype==='pro'?'Packshot professionnel':b.ptype==='iphone'?'📱 Photos iPhone':'—'}</div></div>
      ${b.ptype==='iphone'?`<div><div class="dfield-label">Prise en charge refs</div><div class="dfield-value">${b.iphone_service==='oui'?"✓ Miraggia s'en occupe":'Client autonome'}</div></div>`:''}
    </div></div>
  </div>

  ${b.notes?`<div class="dsection">
    <div class="dsection-title">💬 Notes complémentaires</div>
    <div class="dsection-body"><div class="notes-block">${esc(b.notes)}</div></div>
  </div>`:''}

  <div class="detail-actions">
    <button class="btn btn-danger" onclick="deleteBrief(${b.id})">✕ Supprimer</button>
    <a href="mailto:${esc(b.email)}?subject=Votre%20devis%20Miraggia%20%E2%80%94%20${encodeURIComponent(b.brand||'')}&body=Bonjour%20${encodeURIComponent(b.name||'')}%2C%0A%0AMerci%20pour%20votre%20brief.%0A%0ACordialement%2C%0AL%27%C3%A9quipe%20Miraggia" class="btn btn-abysse" style="text-decoration:none;">✉ Répondre par email</a>
  </div>`;

  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('active');
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('list-view').classList.remove('hidden');
}

async function deleteBrief(id) {
  if (!confirm('Supprimer ce brief définitivement ?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/briefs?id=eq.${id}`, {
    method:'DELETE',
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`}
  });
  await load(); updateKPIs(); closeDetail(); renderList();
}

function copyLink() {
  const url = window.location.href.replace(/[^/]*$/, 'miraggia-brief.html');
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copié !'; btn.style.background = '#a8f070';
    setTimeout(() => { btn.textContent = 'Copier le lien'; btn.style.background = ''; }, 2000);
  }).catch(() => document.getElementById('form-url-input').select());
}

function exportCSV(){
  if(!allBriefs.length){alert('Aucun brief à exporter.');return;}
  const cols=['name','brand','email','phone','vt_ecommerce','vt_ecommerce_looks','vt_ecommerce_visuels','vt_lifestyle','vt_lifestyle_looks','vt_lifestyle_visuels','vt_packshot','vt_packshot_looks','vt_packshot_visuels','vt_morte','vt_morte_visuels','vt_reseaux','vt_reseaux_visuels','vt_video','vt_video_visuels','formats','defs','mcat','mperso','delai','ptype','iphone_service','notes','dateDisplay'];
  const rows=[cols.join(';'),...allBriefs.map(b=>cols.map(c=>{const v=Array.isArray(b[c])?b[c].join('|'):(b[c]||'');return`"${String(v).replace(/"/g,'""')}"`;}).join(';'))];
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+rows.join('\n'));
  a.download=`miraggia-briefs-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

document.getElementById('form-url-input').value = window.location.href.replace(/[^/]*$/, 'miraggia-brief.html');
setInterval(async () => { await load(); updateKPIs(); renderList(); }, 30000);
(async () => { await load(); updateKPIs(); renderList(); })();
</script>
</body>
</html>
